name: CI

on:
  push:
  pull_request:

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset linux
      - name: Build
        run: cmake --build --preset linux
      - name: Test
        run: ctest --preset linux

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: brew install ninja
      - name: Configure
        run: cmake --preset mac
      - name: Build
        run: cmake --build --preset mac --target EG13_all eg13_tests
      - name: Test
        run: ctest --preset mac
      - name: Test the Swift UI
        run: swift test --package-path ui/EG13UI
      - name: Check Objective-C class prefixes
        run: scripts/check-objc-prefix.sh build/mac/plugins/EG13.clap
      - name: Validate plugins
        run: scripts/validate.sh build/mac
      - name: Zip bundles
        run: |
          cd build/mac/plugins
          for b in *.clap *.component *.vst3 *.app; do ditto -c -k --keepParent "$b" "$b.zip"; done
      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: EG13-macos
          path: build/mac/plugins/*.zip
