name: CI

on:
  push:
  pull_request:

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset linux
      - name: Build
        run: cmake --build --preset linux
      - name: Test
        run: ctest --preset linux

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build, test and validate
        uses: ./.github/actions/mac-build
      - name: Package (dry run of the release zip)
        run: |
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/mac/CMakeCache.txt)"
          scripts/package-release.sh build/mac "$version" build/release-zip
      - name: Upload the release zip
        uses: actions/upload-artifact@v4
        with:
          name: EG13-macos
          path: build/release-zip/*.zip
