name: CI

on:
  push:
  pull_request:

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset linux
      - name: Build
        run: cmake --build --preset linux
      - name: Test
        run: ctest --preset linux

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: brew install ninja
      - name: Configure
        run: cmake --preset mac
      - name: Build
        run: cmake --build --preset mac --target EG13_all eg13_tests
      - name: Test
        run: ctest --preset mac
      - name: Validate plugins
        run: scripts/validate.sh build/mac
      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: EG13-macos
          path: build/mac/plugins
